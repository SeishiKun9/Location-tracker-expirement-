<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>📍 Friend Tracker - Map API Demo</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body, html {
      height: 100%;
      width: 100%;
      background-color: #0b0f19;
      color: #fff;
      overflow: hidden;
    }
    #map {
      height: 100%;
      width: 100%;
      z-index: 1;
    }

    /* Floating UI Controls */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(8px);
      padding: 12px 18px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .title-group h1 {
      font-size: 15px;
      font-weight: 700;
      color: #f8fafc;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #eab308;
    }
    .dot.live {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .controls-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .style-select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }
    .btn-action {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-action:hover {
      background: #0369a1;
    }

    /* API Key Banner */
    .key-bar {
      position: absolute;
      top: 80px;
      left: 16px;
      right: 16px;
      z-index: 1000;
      background: rgba(30, 41, 59, 0.95);
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .key-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      color: #38bdf8;
      padding: 4px 8px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 11px;
    }

    /* Bottom Friends Drawer */
    .bottom-bar {
      position: absolute;
      bottom: 20px;
      left: 16px;
      right: 16px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(8px);
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .friends-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .friends-list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .friend-card {
      background: #1e293b;
      padding: 8px 12px;
      border-radius: 10px;
      min-width: 125px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .friend-name {
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .friend-dist {
      font-size: 11px;
      color: #38bdf8;
      margin-top: 2px;
    }

    /* Markers */
    .user-marker {
      background: #0284c7;
      color: white;
      border: 2px solid #fff;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 11px;
      box-shadow: 0 0 12px rgba(2, 132, 199, 0.8);
      animation: pulse 2s infinite;
    }
    .friend-marker {
      color: white;
      border: 2px solid #fff;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 11px;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(2, 132, 199, 0); }
      100% { box-shadow: 0 0 0 0 rgba(2, 132, 199, 0); }
    }
  </style>
</head>
<body>

  <!-- Map Canvas -->
  <div id="map"></div>

  <!-- Top Status Bar -->
  <div class="top-bar">
    <div class="title-group">
      <h1>📍 Friend Tracker (Map API Demo)</h1>
      <div class="status-badge">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">Acquiring GPS...</span>
      </div>
    </div>

    <div class="controls-right">
      <select class="style-select" id="style-select" onchange="changeMapStyle()">
        <option value="maptiler-streets">MapTiler Streets (API Key)</option>
        <option value="maptiler-satellite">MapTiler Satellite (API Key)</option>
        <option value="carto-dark">Carto Dark Mode (Free)</option>
        <option value="osm-standard">OpenStreetMap Standard (Free)</option>
      </select>
      <button class="btn-action" onclick="recenterOnMe()">🎯 Recenter</button>
    </div>
  </div>

  <!-- API Key Bar -->
  <div class="key-bar">
    <span style="color: #38bdf8; font-weight: 600;">🔑 API Key (.env):</span>
    <input type="text" id="api-key-input" class="key-input" value="get_your_own_OpIi9ZULNHzrESv6T2vL" placeholder="Paste MapTiler API Key" />
    <button class="btn-action" style="padding: 4px 8px;" onclick="applyApiKey()">Apply</button>
  </div>

  <!-- Bottom Active Friends Panel -->
  <div class="bottom-bar">
    <div class="friends-header">
      <span>Connected Friends (3)</span>
      <span style="color: #38bdf8;">Configured via .env</span>
    </div>
    <div class="friends-list" id="friends-list"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let currentTileLayer = null;
    let apiKey = document.getElementById('api-key-input').value;

    const map = L.map('map', { zoomControl: false }).setView([37.7749, -122.4194], 14);

    // Map Tile Styles definition
    function getTileUrl(style, key) {
      switch(style) {
        case 'maptiler-streets':
          return `https://api.maptiler.com/maps/streets-v2/{z}/{x}/{y}.png?key=${key}`;
        case 'maptiler-satellite':
          return `https://api.maptiler.com/maps/hybrid/{z}/{x}/{y}.jpg?key=${key}`;
        case 'carto-dark':
          return 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
        case 'osm-standard':
        default:
          return 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
      }
    }

    function setLayer(style) {
      if (currentTileLayer) map.removeLayer(currentTileLayer);
      const url = getTileUrl(style, apiKey);
      currentTileLayer = L.tileLayer(url, {
        maxZoom: 19,
        attribution: '© MapTiler / OpenStreetMap contributors'
      }).addTo(map);
    }

    setLayer('maptiler-streets');

    function changeMapStyle() {
      const selected = document.getElementById('style-select').value;
      setLayer(selected);
    }

    function applyApiKey() {
      apiKey = document.getElementById('api-key-input').value.trim();
      changeMapStyle();
    }

    // Distance Calculation
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      const d = R * c;
      return d < 1 ? `${Math.round(d * 1000)} m` : `${d.toFixed(2)} km`;
    }

    let myPos = { lat: 37.7749, lng: -122.4194 };
    let myMarker = null;
    let lines = [];

    const friends = [
      { id: 'f1', name: 'Alex', color: '#10b981', latOffset: 0.0016, lngOffset: 0.0012, marker: null },
      { id: 'f2', name: 'Sarah', color: '#ec4899', latOffset: -0.0018, lngOffset: -0.0015, marker: null },
      { id: 'f3', name: 'Dave', color: '#f59e0b', latOffset: 0.0022, lngOffset: -0.0018, marker: null }
    ];

    function renderFriends() {
      const listEl = document.getElementById('friends-list');
      listEl.innerHTML = '';
      lines.forEach(l => map.removeLayer(l));
      lines = [];

      friends.forEach(f => {
        const friendLat = myPos.lat + f.latOffset;
        const friendLng = myPos.lng + f.lngOffset;
        const dist = calculateDistance(myPos.lat, myPos.lng, friendLat, friendLng);

        if (!f.marker) {
          const icon = L.divIcon({
            html: `<div class="friend-marker" style="background:${f.color}">${f.name[0]}</div>`,
            className: ''
          });
          f.marker = L.marker([friendLat, friendLng], { icon }).addTo(map)
            .bindPopup(`<b>${f.name}</b><br>${dist} away`);
        } else {
          f.marker.setLatLng([friendLat, friendLng]);
        }

        const line = L.polyline([[myPos.lat, myPos.lng], [friendLat, friendLng]], {
          color: f.color,
          weight: 2,
          opacity: 0.7,
          dashArray: '5, 8'
        }).addTo(map);
        lines.push(line);

        const card = document.createElement('div');
        card.className = 'friend-card';
        card.innerHTML = `
          <div class="friend-name"><span style="color:${f.color}">●</span> ${f.name}</div>
          <div class="friend-dist">${dist} away</div>
        `;
        card.onclick = () => {
          map.flyTo([friendLat, friendLng], 16);
          f.marker.openPopup();
        };
        listEl.appendChild(card);
      });
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (pos) => {
          myPos.lat = pos.coords.latitude;
          myPos.lng = pos.coords.longitude;

          document.getElementById('status-dot').classList.add('live');
          document.getElementById('status-text').innerText = `Live GPS (${myPos.lat.toFixed(4)}, ${myPos.lng.toFixed(4)})`;

          if (!myMarker) {
            const userIcon = L.divIcon({
              html: `<div class="user-marker">ME</div>`,
              className: ''
            });
            myMarker = L.marker([myPos.lat, myPos.lng], { icon: userIcon }).addTo(map);
            map.setView([myPos.lat, myPos.lng], 15);
          } else {
            myMarker.setLatLng([myPos.lat, myPos.lng]);
          }
          renderFriends();
        },
        (err) => {
          document.getElementById('status-text').innerText = 'Demo GPS Mode';
          if (!myMarker) {
            const userIcon = L.divIcon({ html: `<div class="user-marker">ME</div>`, className: '' });
            myMarker = L.marker([myPos.lat, myPos.lng], { icon: userIcon }).addTo(map);
          }
          renderFriends();
        },
        { enableHighAccuracy: true }
      );
    }

    function recenterOnMe() {
      if (myMarker) map.flyTo([myPos.lat, myPos.lng], 16);
    }
  </script>
</body>
</html>
